services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  python_app:
    build: .
    container_name: python_ollama_app
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama
    stdin_open: true
    tty: true

volumes:
  ollama_data: