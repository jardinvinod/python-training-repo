services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_module7_06

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama


  chat_app:
    build: .

    container_name: ollama_streamlit_chat

    ports:
      - "8501:8501"

    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b

      # Change this to true or false
      USE_PERSONA: "true"

    depends_on:
      - ollama


volumes:
  ollama_data: